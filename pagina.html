<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galleria Foto</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(
        to bottom,
        #7b2cbf 0%,
        #9d4edd 45%,
        #ffffff 45%,
        #ffffff 100%
    );
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:450px;
    text-align:center;
}

h1{
    color:white;
    margin-bottom:20px;
}

.carousel{
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    background:white;
}

.slides{
    display:flex;
    transition:transform .5s ease;
}

.slides img{
    width:100%;
    flex-shrink:0;
    display:block;
}

.controls{
    margin-top:15px;
}

.controls button{
    border:none;
    background:#7b2cbf;
    color:white;
    padding:10px 16px;
    border-radius:50px;
    cursor:pointer;
    margin:0 5px;
    font-size:18px;
}

.qr-section{
    margin-top:35px;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.qr-section img{
    width:220px;
    max-width:100%;
}

.qr-section h2{
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Le Nostre Foto</h1>

    <div class="carousel">
        <div class="slides" id="slides">

            <img src="https://drive.google.com/uc?export=view&id=17o2VpyJqCempQ6yVl1lD1MLGuqJj       <img src="https://drive.google.com/uc?export=view&id=1WoAZImCMD8PP7tE49bRt1w
            <img src="https://drive.google.com/uc?export=view&id=1cSk-zXtvJejmnfcsozj0f3_VLph-ExTs">
<img src="https://drive.google.com/uc?export=view&id=1C_sp6uHVqGQ6VgJfD-OjNCPjHaEmyz  </div>
    </div>

    <div class="controls">
        <button onclick="prevSlide()">◀</button>
        <button onclick="nextSlide()">▶</button>
    </div>

    <div class="qr-section">

        <h2>Scansiona il QR Code</h2>

        <img src="ive.google.com/thumbnail?id=1EV8k1qzZlDZklFI8ZlJuUZNsqpnZD9s4&sz=w1000">

</div>

<script>

let current = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;

function showSlide(index){
    slides.style.transform = `translateX(-${index * 100}%)`;
}

function nextSlide(){
    current = (current + 1) % total;
    showSlide(current);
}

function prevSlide(){
    current = (current - 1 + total) % total;
    showSlide(current);
}

setInterval(nextSlide,3000);

</script>

</body>
</html>
